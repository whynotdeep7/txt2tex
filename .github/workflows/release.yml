name: Release

# Runs when you push a version tag like v0.3.0. Builds binaries for
# macOS (Apple Silicon), Linux (x86_64) and Windows (x86_64) and attaches
# them to a GitHub release.
#
# HOW TO RELEASE:
#   bump version in Cargo.toml, commit
#   git tag v0.3.0
#   git push && git push --tags

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: txt2tex
            asset: txt2tex-macos-arm64

          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: txt2tex
            asset: txt2tex-linux-x86_64

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: txt2tex.exe
            asset: txt2tex-windows-x86_64.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary (Unix)
        if: matrix.os != 'windows-latest'
        run: cp target/${{ matrix.target }}/release/${{ matrix.binary }} ${{ matrix.asset }}

      - name: Rename binary (Windows)
        if: matrix.os == 'windows-latest'
        run: Copy-Item "target\${{ matrix.target }}\release\${{ matrix.binary }}" "${{ matrix.asset }}"

      - name: Upload to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
