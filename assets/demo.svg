<svg xmlns="http://www.w3.org/2000/svg" width="612" height="408" viewBox="0 0 612 408" role="img" aria-label="txt2tex build and analyze in a terminal">
<rect width="612" height="408" rx="12" fill="#0d1117"/><rect x="0.5" y="0.5" width="611" height="407" rx="12" fill="none" stroke="#30363d"/>
<circle cx="22" cy="20" r="6" fill="#ff5f57"/><circle cx="42" cy="20" r="6" fill="#febc2e"/><circle cx="62" cy="20" r="6" fill="#28c840"/>
<text x="306.0" y="25" text-anchor="middle" font-family="-apple-system, Segoe UI, sans-serif" font-size="12" fill="#6e7681">~/resume</text>
<g font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" xml:space="preserve">
<text x="28" y="66.0"><tspan fill="#6e7681">$ </tspan><tspan fill="#c9d1d9" font-weight="bold">txt2tex build</tspan></text>
<text x="28" y="88.4"><tspan fill="#7dd3fc">  ▸ </tspan><tspan fill="#c9d1d9">typesetting with tectonic</tspan></text>
<text x="28" y="110.8"><tspan fill="#3fb950" font-weight="bold">  ✓ </tspan><tspan fill="#c9d1d9">resume.pdf (32 KB)</tspan></text>
<text x="28" y="133.2"><tspan fill="#e3b341">  → </tspan><tspan fill="#6e7681">1 issue, 2 suggestions — see them with: txt2tex analyze</tspan></text>
<text x="28" y="178.0"><tspan fill="#6e7681">$ </tspan><tspan fill="#c9d1d9" font-weight="bold">txt2tex analyze</tspan></text>
<text x="28" y="222.8"><tspan fill="#c9d1d9" font-weight="bold">  Personal Info</tspan></text>
<text x="28" y="245.2"><tspan fill="#ff7b72" font-weight="bold">    ✗  </tspan><tspan fill="#c9d1d9">Missing phone number</tspan></text>
<text x="28" y="267.6"><tspan fill="#e3b341">    →  </tspan><tspan fill="#6e7681">Add your GitHub — recruiters do look</tspan></text>
<text x="28" y="312.4"><tspan fill="#c9d1d9" font-weight="bold">  Experience</tspan></text>
<text x="28" y="334.8"><tspan fill="#e3b341">    →  </tspan><tspan fill="#6e7681">Add a number to "Conducted weekly lab sessions and doubt…"</tspan></text>
<text x="28" y="379.6"><tspan fill="#a78bfa" font-weight="bold">  score 84/100</tspan><tspan fill="#6e7681">   1 issue, 2 suggestions</tspan></text>
</g></svg>
